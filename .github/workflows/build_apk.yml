name: Build Game APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          cache: true
      - run: flutter pub get
      - run: flutter create --platforms=android --project-name loot_arena .
      - run: rm -f test/widget_test.dart
      - run: |
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 34/' android/app/build.gradle*
          sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 34/' android/app/build.gradle*
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/' android/app/build.gradle*
      - run: flutter analyze lib
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: loot-arena-apk
          path: build/app/outputs/flutter-apk/app-release.apk
